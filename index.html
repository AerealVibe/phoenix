<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOENIX Warehouse</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e8eef7;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{border-bottom:1px solid #334155}small{color:#a5b4c7}button,input,textarea{font:inherit;border:1px solid #52647c;border-radius:8px;padding:12px;background:#203149;color:inherit}button{cursor:pointer}button:hover{border-color:#7dd3fc}h2{margin:12px 0}.map{position:relative;aspect-ratio:1; width:84%;margin:65px 12% 25px 4%;border:2px solid #8fa4bd;background:#172437}.zone{position:absolute;border-radius:0;background:#344b65;border:1px solid #8fa4bd;display:grid;place-content:center;text-align:center;padding:0;font-size:clamp(12px,3vw,22px)}.macro{background:repeating-linear-gradient(135deg,#344b65,#344b65 9px,#405973 9px,#405973 11px)}.in,.out{position:absolute;color:#6ee7b7;font-weight:bold}.in{top:-45px;left:40%}.out{left:102%;top:45%;color:#fbbf24}.center{position:absolute;left:29%;top:43%;width:66%;text-align:center;color:#a5b4c7;pointer-events:none}.slots{display:grid;gap:10px;animation:zoom .25s ease}.slot{min-height:85px;background:#123e36;border-color:#399e83;overflow-wrap:anywhere}.occupied{background:#1755b5;border-color:#60a5fa;color:white}.occupied small{color:#e0efff}.slot.selected-occupied{background:#86efac;border-color:#bbf7d0;color:#123524}.slot.selected-occupied small{color:#123524}.highlight{outline:3px solid #93c5fd;outline-offset:3px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}label{display:block;margin:12px 0}input,textarea{width:100%;display:block;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#172437;padding:18px;border-radius:12px;margin-top:16px}@keyframes zoom{from{opacity:.3;transform:scale(.9)}to{opacity:1;transform:scale(1)}} .reserved{background:#51491f;border-color:#eab308}.in,.out{padding:6px;white-space:nowrap}.out{font-size:12px}select{display:block;width:100%;padding:12px;background:#203149;color:inherit;border:1px solid #52647c;border-radius:8px;font:inherit} .slot.selected-occupied{background:#86efac;color:#14532d} .slot.cyan{background:#22d3ee;color:#083344;border-color:#67e8f9}.slot.cyan small{color:#083344}.demo{border:1px solid #22d3ee;padding:12px;border-radius:10px;margin-bottom:16px} </style><header><strong>PHOENIX</strong> <small> / WAREHOUSE · v1.0 DEMO</small></header><main><div class="demo"><b>MODALITÀ DEMO · ciclo completo</b><p><small>15 bancali, stessi codici da IN a OUT. Foto simulate chiaramente contrassegnate.</small></p><button onclick="resetDemo()">Riavvia demo</button></div><div id="app"></div></main><script>
const app=document.querySelector('#app');let db={},history=[],cfg={};try{let d=JSON.parse(localStorage.getItem('phoenix-demo-cycle-v10')||'{}');db=d.db||{};history=d.history||[];cfg=d.cfg||{}}catch{};let incoming;try{incoming=JSON.parse(localStorage.getItem('phoenix-demo-cycle-v10')||'{}').incoming}catch{};let zone='',level=0;const areas={A:[60,0,40,30],B:[0,0,26,27],C:[0,27,26,27],D:[0,54,26,46],E:[26,80,37,20],F:[63,80,37,20]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('phoenix-demo-cycle-v10',JSON.stringify({db,history,cfg,incoming}))}catch{alert('Salvataggio locale non disponibile')}}function dims(z){return cfg[z]||[3,4]}function count(z){return Object.keys(db).filter(k=>k.startsWith(z+'-')).length}function map(l){outFocus=false;level=l;let blocks=l===0?[[0,0,26,100],[60,0,40,30],[26,80,74,20]]:Object.values(areas);app.innerHTML=`<small>Livello ${l+1} di 3</small><h2>${l?'Macroaree A–F':'Mappa generale'}</h2><div class="actions">${l?'<button onclick="map(0)">← Generale</button>':'<button onclick="map(1)">Apri macroaree →</button>'}<button onclick="log()">Registro movimenti</button><button onclick="daily()">Attività di oggi</button></div><div class="map"><button class="in" onclick="inbound()">IN ↓</button><button class="out" onclick="outbound()">OUT →</button><span class="center">Area movimentazione</span>${blocks.map((b,i)=>{let z=Object.keys(areas)[i];return `<button class="zone macro" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" onclick="${l?`openZone('${z}')`:'map(1)'}">${l?`${z}<small>${count(z)}/${dims(z).reduce((a,b)=>a*b)}</small>`:''}</button>`}).join('')}</div><small>Seleziona ${l?'una macroarea':'una zona di stoccaggio'} per ingrandire.</small>`}function openZone(z,selected=null,back=null){zone=z;level=2;let [r,c]=dims(z);app.innerHTML=`<small>Livello 3 di 3 · Magazzino / ${z}</small><h2>Macroarea ${z}</h2><div class="actions"><button onclick="map(1)">← Macroaree</button><button onclick="resizeZone()">Configura griglia</button>${back?`<button onclick="containerView('${back}')">← Container ${back}</button>`:''}</div><p>${count(z)} occupati · ${Array.from({length:r*c},(_,i)=>z+'-'+(i+1)).filter(k=>reservation(k)&&!db[k]).length} riservati · ${Array.from({length:r*c},(_,i)=>z+'-'+(i+1)).filter(k=>!db[k]&&!reservation(k)).length} liberi</p><div class="legend"><span><i style="background:#123e36"></i>Libero</span><span><i style="background:#eab308"></i>Riservato</span><span><i style="background:#1755b5"></i>Da depositare</span><span><i style="background:#86efac"></i>Stoccato</span><span><i style="background:#22d3ee"></i>OUT oggi</span></div><div class="slots" style="grid-template-columns:repeat(${c},minmax(0,1fr))">${Array.from({length:r*c},(_,i)=>{let n=(i%c)*r+Math.floor(i/c)+1,k=z+'-'+n,d=db[k],res=reservation(k);return `<button class="slot ${d?(d.phase==='placing'?'occupied':d.due===day(0)&&outFocus?'cyan':'selected-occupied'):res?'reserved':''} ${selected===k?'highlight':''}" data-slot="${k}" aria-pressed="false" onclick="detail('${k}')"><b>${n}</b><br><small>${d?esc(d.code):res?'Riservato '+esc(res.code):'Libero'}</small></button>`}).join('')}</div><div id="detail"></div>`;if(selected&&db[selected]){document.querySelector('#detail').innerHTML=`<div class="panel" role="status"><b>Posizione assegnata · ${esc(selected)}</b><p>${esc(db[selected].code)} · Controlla lo stato della merce</p></div>`}}function resizeZone(){let [r,c]=dims(zone),nr=Number(prompt('Numero righe',r)),nc=Number(prompt('Numero colonne',c));if(!Number.isInteger(nr)||!Number.isInteger(nc)||nr<1||nc<1||nr>20||nc>12)return;if(count(zone)||incoming.some(c=>c.pallets.some(p=>p.state==='pending'&&p.dest?.startsWith(zone+'-')))){alert('Svuota la macroarea prima di cambiare la numerazione.');return}cfg[zone]=[nr,nc];save();openZone(zone)}function detail(k){let d=db[k],res=reservation(k);document.querySelectorAll(".slot").forEach(b=>{let active=!!d&&b.dataset.slot===k;b.setAttribute("aria-pressed",String(active));b.classList.remove("highlight")});if(!d&&res){document.querySelector('#detail').innerHTML=`<div class="panel">${k} riservato a ${esc(res.code)}<br><button onclick="receive('${res.code}')">Conferma stoccaggio</button></div>`;return;}document.querySelector('#detail').innerHTML=`<div class="panel"><h2>Posizione ${k}</h2>${d?`<p>Ingresso: ${esc(new Date(d.date).toLocaleString())}</p>`:''}<form id="edit"><label>Codice container / bancale<input name="code" required value="${esc(d?.code)}"></label><label>Descrizione<textarea name="desc">${esc(d?.desc)}</textarea></label><div class="actions"><button type="submit">${d?'Aggiorna':'Registra ingresso'}</button>${d?`<button type="button" onclick="out('${k}')">Registra uscita</button>`:''}</div></form></div>`;document.querySelector('#edit').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),code=f.get('code').trim();if(!code)return;if(Object.entries(db).some(([id,v])=>id!==k&&v.code===code)){alert('Codice già presente');return}db[k]={code,desc:f.get('desc'),date:d?.date||new Date().toISOString(),due:d?.due};history.unshift({type:d?'MODIFICA':'IN',k,...db[k],at:new Date().toISOString()});save();openZone(zone);detail(k)}}function out(k){if(!db[k]||db[k].phase==='placing')return;if(!confirm('Confermare uscita da '+k+'?'))return;history.unshift({type:'OUT',k,...db[k],at:new Date().toISOString()});delete db[k];let pallet=allPallets().find(p=>p.code===history[0].code);if(pallet)pallet.state='out';save();openZone(k.split('-')[0])}function log(){app.innerHTML=`<button onclick="map(1)">← Mappa</button><h2>Registro movimenti</h2>${history.map(h=>`<div class="panel">${esc(h.type)} · ${esc(h.k)} · ${esc(h.code)}<br><small>${esc(new Date(h.at).toLocaleString())}</small></div>`).join('')||'Nessun movimento'}`}
function day(n){let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
if(!Array.isArray(incoming))incoming=Array.from({length:3},(_,i)=>({code:`CONT00${i+1}`,pallets:Array.from({length:5},(_,j)=>({code:`CONT00${i+1}-P0${j+1}`,due:day(0),state:'pending',dest:null}))}));
function allPallets(){return incoming.flatMap(c=>c.pallets)}
function reservation(k){return allPallets().find(p=>p.state==='pending'&&p.dest===k)}
function plan(){let free=[];for(let [z,[x,y,w,h]] of Object.entries(areas)){let [r,c]=dims(z);for(let n=1;n<=r*c;n++){let k=z+'-'+n;if(db[k])continue;let px=x+w*(Math.floor((n-1)/r)+.5)/c,py=y+h*((n-1)%r+.5)/r;free.push({k,d:Math.hypot(100-px,45-py)})}}free.sort((a,b)=>a.d-b.d||a.k.localeCompare(b.k));let pending=allPallets().filter(p=>p.state==='pending').sort((a,b)=>a.due.localeCompare(b.due)||a.code.localeCompare(b.code));pending.forEach((p,i)=>p.dest=free[i]?.k||null);save()}
function inbound(){outFocus=false;plan();app.innerHTML=`<button onclick="map(0)">← Mappa</button><h2>IN · Container in entrata</h2><small>15 bancali dimostrativi · priorità per data di uscita</small>${incoming.map(c=>`<div class="panel"><h2>${c.code}</h2><p>${c.pallets.filter(p=>p.state==='pending').length} da stoccare / 5 bancali</p><button onclick="containerView('${c.code}')">Apri container →</button></div>`).join('')}`}
function containerView(code){let c=incoming.find(c=>c.code===code);app.innerHTML=`<button onclick="inbound()">← Container</button><h2>${code}</h2><small>Modifica le date previste per ricalcolare le destinazioni di tutti i bancali ancora in attesa.</small>${c.pallets.map(p=>`<div class="panel"><b>${p.code}</b><label>Uscita prevista<input type="date" value="${esc(p.due)}" ${p.state!=='pending'?'disabled':''} onchange="changeDue('${p.code}',this.value,'${code}')"></label><p>Destinazione: <b>${esc(p.dest||'Nessun posto disponibile')}</b> · ${p.state==='pending'?'Da stoccare':p.state==='out'?'Uscito':'Stoccato'}</p>${p.state==='pending'&&p.dest?`<button onclick="receive('${p.code}','${code}')">Conferma stoccaggio</button>`:p.state==='stored'&&p.dest?`<button onclick="openZone('${p.dest.split('-')[0]}','${p.dest}','${code}')">Mostra posizione</button>`:''}</div>`).join('')}`}
function changeDue(code,value,c){if(value){allPallets().find(p=>p.code===code).due=value;plan()}containerView(c)}
function receive(code,c){let p=allPallets().find(p=>p.code===code);if(!p||p.state!=='pending'||!p.dest||db[p.dest])return;if(!confirm(`Confermare ${code} in ${p.dest}?`))return;let k=p.dest;db[k]={code:p.code,desc:'Bancale da '+p.code.split('-')[0],date:new Date().toISOString(),due:p.due};p.state='stored';history.unshift({type:'IN',k,...db[k],at:new Date().toISOString()});plan();openZone(k.split('-')[0],k,c||null)}
function outbound(){outFocus=true;app.innerHTML=`<button onclick="map(0)">← Mappa</button><h2>OUT · Merci in uscita</h2>${Object.entries(db).filter(([k,d])=>d.phase!=='placing').sort((a,b)=>(a[1].due||'9999').localeCompare(b[1].due||'9999')).map(([k,d])=>`<div class="panel"><b>${esc(d.code)}</b> · ${esc(k)}<p>Uscita prevista: ${esc(d.due||'Non definita')}</p><button onclick="out('${k}')">Registra uscita</button></div>`).join('')||'Nessuna merce stoccata'}`}
// v0.6 quality workflow
function plan(){let free=[];for(let [z,[x,y,w,h]] of Object.entries(areas)){let [r,c]=dims(z);for(let n=1;n<=r*c;n++){let k=z+'-'+n;if(!db[k])free.push({k,d:Math.hypot(100-x-w*(Math.floor((n-1)/r)+.5)/c,45-y-h*((n-1)%r+.5)/r)})}}free.sort((a,b)=>a.d-b.d);for(let p of allPallets().filter(p=>p.state==='pending').sort((a,b)=>a.due.localeCompare(b.due)||a.code.localeCompare(b.code))){let i=p.condition?free.findIndex(f=>f.k.startsWith('D-')===(p.condition!=='Integro')):-1;p.dest=i<0?null:free.splice(i,1)[0].k}save()}
function photo(input,done){let f=input.files[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,640/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);done(c.toDataURL('image/jpeg',.55))};img.onerror=()=>{URL.revokeObjectURL(url);alert('Foto non leggibile')};img.src=url}
function quality(code){let p=allPallets().find(p=>p.code===code);app.innerHTML=`<button onclick="containerView('${code.split('-')[0]}')">← Container</button><h2>Controllo qualità · ${esc(code)}</h2><label>Foto in ingresso<input type="file" accept="image/*" capture="environment" id="photo"></label><img id="preview" style="max-width:100%;max-height:220px" ${p.before?`src="${esc(p.before)}"`:''}><label>Condizioni<select id="condition"><option value="">Seleziona</option>${['Integro','Rovinato','Rotto'].map(x=>`<option ${p.condition===x?'selected':''}>${x}</option>`).join('')}</select></label><button id="go">Assegna posizione</button>`;let pic=p.before;document.querySelector('#photo').onchange=e=>photo(e.target,v=>{pic=v;document.querySelector('#preview').src=v});document.querySelector('#go').onclick=()=>{let condition=document.querySelector('#condition').value;if(!pic||!condition)return alert('Foto e condizioni obbligatorie');p.before=pic;p.condition=condition;p.inspectedAt=new Date().toISOString();plan();if(!p.dest){alert('Nessun posto disponibile nella zona prevista');return containerView(code.split('-')[0])}receive(code,code.split('-')[0])}}
function receive(code,c){let p=allPallets().find(p=>p.code===code);if(!p||p.state!=='pending')return;if(!p.before||!p.condition)return quality(code);if(!p.dest||db[p.dest])return alert('Posizione non disponibile');let k=p.dest;db[k]={code,desc:'Bancale da '+c,due:p.due,condition:p.condition,phase:'placing'};p.state='placing';plan();openZone(k.split('-')[0],k,c)}
function detail(k){let d=db[k],res=reservation(k),p=d&&allPallets().find(p=>p.code===d.code);let el=document.querySelector('#detail');if(!d){el.innerHTML=`<div class="panel">${esc(k)} · ${res?'Riservato a '+esc(res.code):'Libero'}${res?`<button onclick="quality('${res.code}')">Controllo qualità</button>`:''}</div>`;return}el.innerHTML=`<div class="panel"><h2>${esc(k)} · ${esc(d.code)}</h2><p>${esc(d.condition||'Condizioni non registrate')}</p>${p?.before?`<img style="max-width:100%;max-height:180px" src="${esc(p.before)}">`:''}${d.phase==='placing'?`<label>Foto di conferma dopo il deposito<input id="finalphoto" type="file" accept="image/*" capture="environment"></label><img id="finalpreview" style="max-width:100%;max-height:220px"><label>Valutazione finale<select id="finalCond"><option value="">Seleziona</option><option>Integro</option><option>Rovinato</option><option>Rotto</option></select></label><button id="finish">Conferma deposito</button>`:`<p>Stoccato</p>${p?.after?`<img style="max-width:100%;max-height:180px" src="${esc(p.after)}">`:''}<br><button onclick="out('${k}')">Registra uscita</button>`}</div>`;if(d.phase==='placing'){let pic;document.querySelector('#finalphoto').onchange=e=>photo(e.target,v=>{pic=v;document.querySelector('#finalpreview').src=v});document.querySelector('#finish').onclick=()=>{let fc=document.querySelector('#finalCond').value;if(!pic||!fc)return alert('Foto e valutazione finale obbligatorie');p.finalCondition=fc;d.finalCondition=fc;p.after=pic;p.state='stored';p.storedAt=new Date().toISOString();d.date=p.storedAt;d.phase='stored';history.unshift({type:'IN',k,code:d.code,at:d.date,condition:d.condition});save();openZone(k.split('-')[0]);detail(k)}}}
function containerView(code){let c=incoming.find(c=>c.code===code);app.innerHTML=`<button onclick="inbound()">← Container</button><h2>${code}</h2>${c.pallets.map(p=>`<div class="panel"><b>${p.code}</b><label>Uscita prevista<input type="date" value="${esc(p.due)}" ${p.state!=='pending'?'disabled':''} onchange="changeDue('${p.code}',this.value,'${code}')"></label><p style="color:${p.state==='stored'?'#86efac':p.state==='out'?'#a5b4c7':'#facc15'}">${p.state==='stored'?'Stoccato':p.state==='out'?'Uscito':'Da stoccare oggi'} · ${esc(p.dest||'Da assegnare')}</p>${p.state==='pending'?`<button onclick="quality('${p.code}')">Controllo qualità</button>`:p.state!=='out'&&p.dest?`<button onclick="openZone('${p.dest.split('-')[0]}','${p.dest}','${code}');detail('${p.dest}')">Mostra posizione</button>`:''}</div>`).join('')}`}
function daily(){app.innerHTML=`<button onclick="map(0)">← Mappa</button><h2>Attività di oggi</h2>${allPallets().filter(p=>['pending','placing'].includes(p.state)||p.storedAt&&new Date(p.storedAt).toDateString()===new Date().toDateString()).map(p=>`<div class="panel" style="border-left:5px solid ${p.state==='stored'||p.state==='out'?'#86efac':'#facc15'}">${esc(p.code)} · ${p.state==='stored'||p.state==='out'?'Completato oggi':'Da stoccare oggi'}<br><button onclick="containerView('${p.code.split('-')[0]}')">Apri</button></div>`).join('')}`}
// v0.7 outbound workflow
let dispatch={};try{dispatch=JSON.parse(localStorage.getItem('phoenix-demo-dispatch-v10')||'{}')}catch{}
function saveDispatch(){localStorage.setItem('phoenix-demo-dispatch-v10',JSON.stringify(dispatch))}
function shipment(code){return dispatch[code]||(dispatch[code]={ddt:'DDT'+code.slice(-3),items:{}})}
let outFocus=false;
function eligible(code){return Object.entries(db).filter(([k,d])=>d.phase!=='placing'&&d.due===day(0)&&d.code.startsWith(code+'-'))}
function outbound(){outFocus=true;app.innerHTML=`<button onclick="map(0)">← Mappa</button><h2>OUT · Carichi di oggi</h2><label>Codice container demo (oppure apri la lista)<input id="scan" placeholder="CONT001" autocomplete="off"></label><button id="scanGo">Apri container</button>${incoming.map(c=>`<div class="panel"><b>${c.code}</b><p>${eligible(c.code).length} da caricare oggi · ${Object.values(dispatch[c.code]?.items||{}).filter(x=>x.loadedAt?.slice(0,10)===day(0)).length} caricati</p><button onclick="loadView('${c.code}')">Apri lista</button></div>`).join('')}`;let go=()=>{let code=document.querySelector('#scan').value.trim().toUpperCase();if(!incoming.some(c=>c.code===code))return alert('Container non riconosciuto');loadView(code)};document.querySelector('#scanGo').onclick=go;document.querySelector('#scan').onkeydown=e=>{if(e.key==='Enter')go()};document.querySelector('#scan').focus()}
function loadView(code){outFocus=true;let s=shipment(code), rows=eligible(code), done=Object.entries(s.items).filter(([id,x])=>x.loadedAt&&x.day===day(0));app.innerHTML=`<button onclick="outbound()">← OUT</button><h2>${esc(code)} · Carico di oggi</h2><label>Codice documento di trasporto (DDT)<input id="ddt" value="${esc(s.ddt)}"></label><small>DDT dimostrativo</small><p>${rows.length} da caricare · ${done.length} caricati</p>${rows.map(([k,d])=>`<div class="panel" style="border-left:5px solid #22d3ee;color:#67e8f9"><b>${esc(d.code)}</b><p>Prelievo: ${esc(k)} · Da caricare oggi</p><button onclick="openZone('${k.split('-')[0]}','${k}');detail('${k}')">Mostra posizione ciano</button> <button onclick="loadQC('${code}','${k}')">Quality check / Carica</button></div>`).join('')}${done.map(([id,x])=>`<div class="panel" style="border-left:5px solid #86efac;color:#86efac"><b>${esc(id)} · Caricato</b><p>${esc(x.ddt)} · ${esc(x.condition)}</p>${[x.before,x.after].map(v=>`<img style="max-width:45%;max-height:120px;margin:4px" src="${esc(v)}">`).join('')}</div>`).join('')}${!rows.length&&!done.length?'<p>Nessun bancale stoccato in partenza oggi.</p>':!rows.length?'<p style="color:#86efac">Tutti i bancali attualmente disponibili caricati</p>':''}`;document.querySelector('#ddt').onchange=e=>{s.ddt=e.target.value.trim();saveDispatch()}}
function loadQC(code,k){let d=db[k];if(!d||!eligible(code).some(([key])=>key===k))return loadView(code);let s=shipment(code);if(!s.ddt)return alert('Inserire il DDT');let x=s.items[d.code]||{};app.innerHTML=`<button onclick="loadView('${code}')">← Lista carico</button><h2>Quality check · ${esc(d.code)}</h2><p>DDT: ${esc(s.ddt)} · Posizione ${esc(k)}</p><label>Foto prima del carico<input id="beforeOut" type="file" accept="image/*" capture="environment"></label><img id="prevOut" style="max-width:100%;max-height:200px"><label>Condizioni<select id="outCond"><option value="">Seleziona</option>${['Integro','Rovinato','Rotto'].map(v=>`<option>${v}</option>`).join('')}</select></label><button id="nextOut">Conferma controllo e procedi al carico</button>`;let pic;document.querySelector('#beforeOut').onchange=e=>photo(e.target,v=>{pic=v;document.querySelector('#prevOut').src=v});document.querySelector('#nextOut').onclick=()=>{let condition=document.querySelector('#outCond').value;if(!pic||!condition)return alert('Foto e condizioni obbligatorie');if(condition!=='Integro'&&!confirm('Merce danneggiata: confermare autorizzazione al carico?'))return;loadFinal(code,k,{before:pic,condition,ddt:s.ddt,checkedAt:new Date().toISOString()})}}
function loadFinal(code,k,x){let d=db[k];app.innerHTML=`<button onclick="loadQC('${code}','${k}')">← Controllo iniziale</button><h2>Foto dopo il carico</h2><p>${esc(d.code)} → ${esc(code)} · ${esc(x.ddt)}</p><label>Foto nel container<input id="afterOut" type="file" accept="image/*" capture="environment"></label><img id="afterPrev" style="max-width:100%;max-height:220px"><label>Valutazione finale<select id="outFinalCond"><option value="">Seleziona</option><option>Integro</option><option>Rovinato</option><option>Rotto</option></select></label><button id="confirmOut">Conferma carico</button>`;let pic;document.querySelector('#afterOut').onchange=e=>photo(e.target,v=>{pic=v;document.querySelector('#afterPrev').src=v});document.querySelector('#confirmOut').onclick=()=>{let fc=document.querySelector('#outFinalCond').value;if(!pic||!fc)return alert('Foto e valutazione finale obbligatorie');x.finalCondition=fc;if(db[k]!==d)return alert('Posizione cambiata');let s=shipment(code),id=d.code,old=s.items[id];s.items[id]={...x,after:pic,loadedAt:new Date().toISOString(),day:day(0),position:k};try{saveDispatch()}catch{if(old)s.items[id]=old;else delete s.items[id];return alert('Spazio locale insufficiente: carico non confermato')}let p=allPallets().find(p=>p.code===id);if(p)p.state='out';delete db[k];history.unshift({type:'OUT',k,code:id,ddt:x.ddt,condition:x.condition,at:s.items[id].loadedAt});plan();loadView(code)}}
function out(k){let d=db[k];if(!d)return;let code=d.code.split('-')[0];if(!incoming.some(c=>c.code===code))return alert('Container di uscita non associato');if(d.due!==day(0))return alert('Il bancale non è previsto in uscita oggi');loadQC(code,k)}



function resetDemo(){if(!confirm('Azzerare solo i dati della demo v1.0 DEMO?'))return;localStorage.removeItem('phoenix-demo-cycle-v10');localStorage.removeItem('phoenix-demo-dispatch-v10');location.reload()}
function scanUI(mode,container=''){let id='demoScan';app.querySelector('h2').insertAdjacentHTML('afterend',`<label>Codice bancale demo (es. CONT001-P01)<input id="${id}" autocomplete="off"></label><button id="demoScanGo">Simula scansione / Apri</button><button id="demoScanExample">Simula scansione prossimo bancale</button>`);let input=document.getElementById(id);let rows=allPallets().filter(p=>!container||p.code.startsWith(container+'-'));let go=()=>{let p=rows.find(p=>p.code===input.value.trim().toUpperCase());if(!p)return alert('Codice non riconosciuto');if(mode==='IN'){if(p.state==='pending')quality(p.code);else if(p.state==='placing'||p.state==='stored'){openZone(p.dest.split('-')[0],p.dest,p.code.split('-')[0]);detail(p.dest)}else alert('Bancale già uscito')}else{if(p.state!=='stored')return alert('Bancale non disponibile per il carico');out(p.dest)}};document.getElementById('demoScanGo').onclick=go;input.onkeydown=e=>{if(e.key==='Enter')go()};document.getElementById('demoScanExample').onclick=()=>{let p=rows.find(p=>mode==='IN'?['pending','placing'].includes(p.state):p.state==='stored'&&p.due===day(0));if(!p)return alert('Nessun bancale disponibile');input.value=p.code;go()}}
const origIn=inbound,origContainer=containerView,origOut=outbound,origLoad=loadView;
inbound=function(){origIn();scanUI('IN')};containerView=function(c){origContainer(c);scanUI('IN',c)};outbound=function(){origOut();scanUI('OUT')};loadView=function(c){origLoad(c);scanUI('OUT',c);let n=incoming.find(x=>x.code===c).pallets.filter(p=>p.state==='out').length;app.querySelector('h2').insertAdjacentHTML('afterend',`<p style="color:${n===5?'#86efac':'#facc15'}">${n}/5 caricati · ${n===5?'Container completo':'Container non completo'}</p>`)};
function demoPhoto(id,stage){let c=document.createElement('canvas');c.width=480;c.height=260;let x=c.getContext('2d');x.fillStyle='#203149';x.fillRect(0,0,480,260);x.fillStyle='#c49a62';x.fillRect(150,65,180,110);x.strokeStyle='#79552d';x.strokeRect(150,65,180,110);x.fillStyle='#fff';x.font='20px sans-serif';x.fillText('FOTO SIMULATA — DEMO',20,30);x.fillText(id,20,220);x.font='14px sans-serif';x.fillText(stage,20,245);return c.toDataURL('image/jpeg',.6)}
function addDemoPhoto(field,preview,stage,id){let f=document.getElementById(field);if(!f)return;let b=document.createElement('button');b.textContent='Simula foto DEMO';b.type='button';f.parentElement.after(b);f.parentElement.hidden=true;b.onclick=()=>{let data=demoPhoto(id,stage);let img=document.getElementById(preview);img.src=data;f.demoData=data;f.onchange({target:f})}}
const realPhoto=photo;photo=function(input,done){if(input.demoData){let d=input.demoData;delete input.demoData;done(d)}else realPhoto(input,done)};
const oq=quality,od=detail,ol=loadQC,of=loadFinal;
quality=function(id){oq(id);addDemoPhoto('photo','preview','IN prima',id)};
detail=function(k){od(k);if(db[k])addDemoPhoto('finalphoto','finalpreview','IN dopo',db[k].code)};
loadQC=function(c,k){ol(c,k);if(db[k])addDemoPhoto('beforeOut','prevOut','OUT prima',db[k].code)};
loadFinal=function(c,k,x){of(c,k,x);if(db[k])addDemoPhoto('afterOut','afterPrev','OUT dopo',db[k].code)};
const baseMap=map;map=function(n){baseMap(n);if(n===0){app.insertAdjacentHTML('afterbegin',`<div class="panel" style="border:1px solid #22d3ee"><b>DEMO · Ciclo logistico completo</b><p>15 bancali · 3 container · nessuna fotocamera necessaria</p><button onclick="inbound()">Inizia demo IN</button> <button onclick="outbound()">Prosegui OUT</button> <button onclick="resetDemo()">Riavvia demo</button></div>`)}};
plan();map(0);
</script></html>
