<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOENIX Warehouse</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e8eef7;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{border-bottom:1px solid #334155}small{color:#a5b4c7}button,input,textarea{font:inherit;border:1px solid #52647c;border-radius:8px;padding:12px;background:#203149;color:inherit}button{cursor:pointer}button:hover{border-color:#7dd3fc}h2{margin:12px 0}.map{position:relative;aspect-ratio:1; width:84%;margin:65px 12% 25px 4%;border:2px solid #8fa4bd;background:#172437}.zone{position:absolute;border-radius:0;background:#344b65;border:1px solid #8fa4bd;display:grid;place-content:center;text-align:center;padding:0;font-size:clamp(12px,3vw,22px)}.macro{background:repeating-linear-gradient(135deg,#344b65,#344b65 9px,#405973 9px,#405973 11px)}.in,.out{position:absolute;color:#6ee7b7;font-weight:bold}.in{top:-45px;left:40%}.out{left:102%;top:45%;color:#fbbf24}.center{position:absolute;left:29%;top:43%;width:66%;text-align:center;color:#a5b4c7;pointer-events:none}.slots{display:grid;gap:10px;animation:zoom .25s ease}.slot{min-height:85px;background:#123e36;border-color:#399e83;overflow-wrap:anywhere}.occupied{background:#633c29;border-color:#e9a05b}label{display:block;margin:12px 0}input,textarea{width:100%;display:block;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#172437;padding:18px;border-radius:12px;margin-top:16px}@keyframes zoom{from{opacity:.3;transform:scale(.9)}to{opacity:1;transform:scale(1)}} </style><header><strong>PHOENIX</strong> <small> / WAREHOUSE · v0.2</small></header><main><div id="app"></div></main><script>
const app=document.querySelector('#app');let db={},history=[],cfg={};try{let d=JSON.parse(localStorage.getItem('phoenix-v02')||'{}');db=d.db||{};history=d.history||[];cfg=d.cfg||{}}catch{};let zone='',level=0;const areas={A:[60,0,40,30],B:[0,0,26,27],C:[0,27,26,27],D:[0,54,26,46],E:[26,80,37,20],F:[63,80,37,20]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('phoenix-v02',JSON.stringify({db,history,cfg}))}catch{alert('Salvataggio locale non disponibile')}}function dims(z){return cfg[z]||[3,4]}function count(z){return Object.keys(db).filter(k=>k.startsWith(z+'-')).length}function map(l){level=l;let blocks=l===0?[[0,0,26,100],[60,0,40,30],[26,80,74,20]]:Object.values(areas);app.innerHTML=`<small>Livello ${l+1} di 3</small><h2>${l?'Macroaree A–F':'Mappa generale'}</h2><div class="actions">${l?'<button onclick="map(0)">← Generale</button>':'<button onclick="map(1)">Apri macroaree →</button>'}<button onclick="log()">Registro movimenti</button></div><div class="map"><span class="in">IN ↓</span><span class="out">OUT →</span><span class="center">Area movimentazione</span>${blocks.map((b,i)=>{let z=Object.keys(areas)[i];return `<button class="zone macro" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" onclick="${l?`openZone('${z}')`:'map(1)'}">${l?`${z}<small>${count(z)}/${dims(z).reduce((a,b)=>a*b)}</small>`:''}</button>`}).join('')}</div><small>Seleziona ${l?'una macroarea':'una zona di stoccaggio'} per ingrandire.</small>`}function openZone(z){zone=z;level=2;let [r,c]=dims(z);app.innerHTML=`<small>Livello 3 di 3 · Magazzino / ${z}</small><h2>Macroarea ${z}</h2><div class="actions"><button onclick="map(1)">← Macroaree</button><button onclick="resizeZone()">Configura griglia</button></div><p>${count(z)} occupati · ${r*c-count(z)} liberi</p><div class="slots" style="grid-template-columns:repeat(${c},minmax(0,1fr))">${Array.from({length:r*c},(_,i)=>{let n=(i%c)*r+Math.floor(i/c)+1,k=z+'-'+n,d=db[k];return `<button class="slot ${d?'occupied':''}" onclick="detail('${k}')"><b>${n}</b><br><small>${d?esc(d.code):'Libero'}</small></button>`}).join('')}</div><div id="detail"></div>`}function resizeZone(){let [r,c]=dims(zone),nr=Number(prompt('Numero righe',r)),nc=Number(prompt('Numero colonne',c));if(!Number.isInteger(nr)||!Number.isInteger(nc)||nr<1||nc<1||nr>20||nc>12)return;if(count(zone)){alert('Svuota la macroarea prima di cambiare la numerazione.');return}cfg[zone]=[nr,nc];save();openZone(zone)}function detail(k){let d=db[k];document.querySelector('#detail').innerHTML=`<div class="panel"><h2>Posizione ${k}</h2>${d?`<p>Ingresso: ${esc(new Date(d.date).toLocaleString())}</p>`:''}<form id="edit"><label>Codice container / bancale<input name="code" required value="${esc(d?.code)}"></label><label>Descrizione<textarea name="desc">${esc(d?.desc)}</textarea></label><div class="actions"><button type="submit">${d?'Aggiorna':'Registra ingresso'}</button>${d?`<button type="button" onclick="out('${k}')">Registra uscita</button>`:''}</div></form></div>`;document.querySelector('#edit').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),code=f.get('code').trim();if(!code)return;if(Object.entries(db).some(([id,v])=>id!==k&&v.code===code)){alert('Codice già presente');return}db[k]={code,desc:f.get('desc'),date:d?.date||new Date().toISOString()};history.unshift({type:d?'MODIFICA':'IN',k,...db[k],at:new Date().toISOString()});save();openZone(zone);detail(k)}}function out(k){if(!confirm('Confermare uscita da '+k+'?'))return;history.unshift({type:'OUT',k,...db[k],at:new Date().toISOString()});delete db[k];save();openZone(zone)}function log(){app.innerHTML=`<button onclick="map(1)">← Mappa</button><h2>Registro movimenti</h2>${history.map(h=>`<div class="panel">${esc(h.type)} · ${esc(h.k)} · ${esc(h.code)}<br><small>${esc(new Date(h.at).toLocaleString())}</small></div>`).join('')||'Nessun movimento'}`}map(0);
</script></html>
