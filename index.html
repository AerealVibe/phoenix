<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOENIX Warehouse</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e8eef7;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{border-bottom:1px solid #334155}small{color:#a5b4c7}button,input,textarea{font:inherit;border:1px solid #52647c;border-radius:8px;padding:12px;background:#203149;color:inherit}button{cursor:pointer}button:hover{border-color:#7dd3fc}h2{margin:12px 0}.map{position:relative;aspect-ratio:1; width:84%;margin:65px 12% 25px 4%;border:2px solid #8fa4bd;background:#172437}.zone{position:absolute;border-radius:0;background:#344b65;border:1px solid #8fa4bd;display:grid;place-content:center;text-align:center;padding:0;font-size:clamp(12px,3vw,22px)}.macro{background:repeating-linear-gradient(135deg,#344b65,#344b65 9px,#405973 9px,#405973 11px)}.in,.out{position:absolute;color:#6ee7b7;font-weight:bold}.in{top:-45px;left:40%}.out{left:102%;top:45%;color:#fbbf24}.center{position:absolute;left:29%;top:43%;width:66%;text-align:center;color:#a5b4c7;pointer-events:none}.slots{display:grid;gap:10px;animation:zoom .25s ease}.slot{min-height:85px;background:#123e36;border-color:#399e83;overflow-wrap:anywhere}.occupied{background:#1755b5;border-color:#60a5fa;color:white}.occupied small{color:#e0efff}.slot.selected-occupied{background:#86efac;border-color:#bbf7d0;color:#123524}.slot.selected-occupied small{color:#123524}.highlight{outline:3px solid #93c5fd;outline-offset:3px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}label{display:block;margin:12px 0}input,textarea{width:100%;display:block;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#172437;padding:18px;border-radius:12px;margin-top:16px}@keyframes zoom{from{opacity:.3;transform:scale(.9)}to{opacity:1;transform:scale(1)}} .reserved{background:#51491f;border-color:#eab308}.in,.out{padding:6px;white-space:nowrap}.out{font-size:12px}</style><header><strong>PHOENIX</strong> <small> / WAREHOUSE · v0.5</small></header><main><div id="app"></div></main><script>
const app=document.querySelector('#app');let db={},history=[],cfg={};try{let d=JSON.parse(localStorage.getItem('phoenix-v02')||'{}');db=d.db||{};history=d.history||[];cfg=d.cfg||{}}catch{};let incoming;try{incoming=JSON.parse(localStorage.getItem('phoenix-v02')||'{}').incoming}catch{};let zone='',level=0;const areas={A:[60,0,40,30],B:[0,0,26,27],C:[0,27,26,27],D:[0,54,26,46],E:[26,80,37,20],F:[63,80,37,20]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('phoenix-v02',JSON.stringify({db,history,cfg,incoming}))}catch{alert('Salvataggio locale non disponibile')}}function dims(z){return cfg[z]||[3,4]}function count(z){return Object.keys(db).filter(k=>k.startsWith(z+'-')).length}function map(l){level=l;let blocks=l===0?[[0,0,26,100],[60,0,40,30],[26,80,74,20]]:Object.values(areas);app.innerHTML=`<small>Livello ${l+1} di 3</small><h2>${l?'Macroaree A–F':'Mappa generale'}</h2><div class="actions">${l?'<button onclick="map(0)">← Generale</button>':'<button onclick="map(1)">Apri macroaree →</button>'}<button onclick="log()">Registro movimenti</button></div><div class="map"><button class="in" onclick="inbound()">IN ↓</button><button class="out" onclick="outbound()">OUT →</button><span class="center">Area movimentazione</span>${blocks.map((b,i)=>{let z=Object.keys(areas)[i];return `<button class="zone macro" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" onclick="${l?`openZone('${z}')`:'map(1)'}">${l?`${z}<small>${count(z)}/${dims(z).reduce((a,b)=>a*b)}</small>`:''}</button>`}).join('')}</div><small>Seleziona ${l?'una macroarea':'una zona di stoccaggio'} per ingrandire.</small>`}function openZone(z,selected=null,back=null){zone=z;level=2;let [r,c]=dims(z);app.innerHTML=`<small>Livello 3 di 3 · Magazzino / ${z}</small><h2>Macroarea ${z}</h2><div class="actions"><button onclick="map(1)">← Macroaree</button><button onclick="resizeZone()">Configura griglia</button>${back?`<button onclick="containerView('${back}')">← Container ${back}</button>`:''}</div><p>${count(z)} occupati · ${Array.from({length:r*c},(_,i)=>z+'-'+(i+1)).filter(k=>reservation(k)&&!db[k]).length} riservati · ${Array.from({length:r*c},(_,i)=>z+'-'+(i+1)).filter(k=>!db[k]&&!reservation(k)).length} liberi</p><div class="legend"><span><i style="background:#123e36"></i>Libero</span><span><i style="background:#eab308"></i>Riservato</span><span><i style="background:#1755b5"></i>Occupato</span><span><i style="background:#86efac"></i>Selezionato</span></div><div class="slots" style="grid-template-columns:repeat(${c},minmax(0,1fr))">${Array.from({length:r*c},(_,i)=>{let n=(i%c)*r+Math.floor(i/c)+1,k=z+'-'+n,d=db[k],res=reservation(k);return `<button class="slot ${d?'occupied':res?'reserved':''} ${selected===k?'highlight':''}" data-slot="${k}" aria-pressed="false" onclick="detail('${k}')"><b>${n}</b><br><small>${d?esc(d.code):res?'Riservato '+esc(res.code):'Libero'}</small></button>`}).join('')}</div><div id="detail"></div>`;if(selected&&db[selected]){document.querySelector('#detail').innerHTML=`<div class="panel" role="status"><b>Stoccaggio confermato · ${esc(selected)}</b><p>${esc(db[selected].code)} · Posizione occupata</p></div>`}}function resizeZone(){let [r,c]=dims(zone),nr=Number(prompt('Numero righe',r)),nc=Number(prompt('Numero colonne',c));if(!Number.isInteger(nr)||!Number.isInteger(nc)||nr<1||nc<1||nr>20||nc>12)return;if(count(zone)||incoming.some(c=>c.pallets.some(p=>p.state==='pending'&&p.dest?.startsWith(zone+'-')))){alert('Svuota la macroarea prima di cambiare la numerazione.');return}cfg[zone]=[nr,nc];save();openZone(zone)}function detail(k){let d=db[k],res=reservation(k);document.querySelectorAll(".slot").forEach(b=>{let active=!!d&&b.dataset.slot===k;b.classList.toggle("selected-occupied",active);b.setAttribute("aria-pressed",String(active));b.classList.remove("highlight")});if(!d&&res){document.querySelector('#detail').innerHTML=`<div class="panel">${k} riservato a ${esc(res.code)}<br><button onclick="receive('${res.code}')">Conferma stoccaggio</button></div>`;return;}document.querySelector('#detail').innerHTML=`<div class="panel"><h2>Posizione ${k}</h2>${d?`<p>Ingresso: ${esc(new Date(d.date).toLocaleString())}</p>`:''}<form id="edit"><label>Codice container / bancale<input name="code" required value="${esc(d?.code)}"></label><label>Descrizione<textarea name="desc">${esc(d?.desc)}</textarea></label><div class="actions"><button type="submit">${d?'Aggiorna':'Registra ingresso'}</button>${d?`<button type="button" onclick="out('${k}')">Registra uscita</button>`:''}</div></form></div>`;document.querySelector('#edit').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),code=f.get('code').trim();if(!code)return;if(Object.entries(db).some(([id,v])=>id!==k&&v.code===code)){alert('Codice già presente');return}db[k]={code,desc:f.get('desc'),date:d?.date||new Date().toISOString(),due:d?.due};history.unshift({type:d?'MODIFICA':'IN',k,...db[k],at:new Date().toISOString()});save();openZone(zone);detail(k)}}function out(k){if(!confirm('Confermare uscita da '+k+'?'))return;history.unshift({type:'OUT',k,...db[k],at:new Date().toISOString()});delete db[k];let pallet=allPallets().find(p=>p.code===history[0].code);if(pallet)pallet.state='out';save();openZone(k.split('-')[0])}function log(){app.innerHTML=`<button onclick="map(1)">← Mappa</button><h2>Registro movimenti</h2>${history.map(h=>`<div class="panel">${esc(h.type)} · ${esc(h.k)} · ${esc(h.code)}<br><small>${esc(new Date(h.at).toLocaleString())}</small></div>`).join('')||'Nessun movimento'}`}
function day(n){let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
if(!Array.isArray(incoming))incoming=Array.from({length:3},(_,i)=>({code:`CONT00${i+1}`,pallets:Array.from({length:5},(_,j)=>({code:`CONT00${i+1}-P0${j+1}`,due:day(1+((i*5+j)*7)%15),state:'pending',dest:null}))}));
function allPallets(){return incoming.flatMap(c=>c.pallets)}
function reservation(k){return allPallets().find(p=>p.state==='pending'&&p.dest===k)}
function plan(){let free=[];for(let [z,[x,y,w,h]] of Object.entries(areas)){let [r,c]=dims(z);for(let n=1;n<=r*c;n++){let k=z+'-'+n;if(db[k])continue;let px=x+w*(Math.floor((n-1)/r)+.5)/c,py=y+h*((n-1)%r+.5)/r;free.push({k,d:Math.hypot(100-px,45-py)})}}free.sort((a,b)=>a.d-b.d||a.k.localeCompare(b.k));let pending=allPallets().filter(p=>p.state==='pending').sort((a,b)=>a.due.localeCompare(b.due)||a.code.localeCompare(b.code));pending.forEach((p,i)=>p.dest=free[i]?.k||null);save()}
function inbound(){plan();app.innerHTML=`<button onclick="map(0)">← Mappa</button><h2>IN · Container in entrata</h2><small>15 bancali dimostrativi · priorità per data di uscita</small>${incoming.map(c=>`<div class="panel"><h2>${c.code}</h2><p>${c.pallets.filter(p=>p.state==='pending').length} da stoccare / 5 bancali</p><button onclick="containerView('${c.code}')">Apri container →</button></div>`).join('')}`}
function containerView(code){let c=incoming.find(c=>c.code===code);app.innerHTML=`<button onclick="inbound()">← Container</button><h2>${code}</h2><small>Modifica le date previste per ricalcolare le destinazioni di tutti i bancali ancora in attesa.</small>${c.pallets.map(p=>`<div class="panel"><b>${p.code}</b><label>Uscita prevista<input type="date" value="${esc(p.due)}" ${p.state!=='pending'?'disabled':''} onchange="changeDue('${p.code}',this.value,'${code}')"></label><p>Destinazione: <b>${esc(p.dest||'Nessun posto disponibile')}</b> · ${p.state==='pending'?'Da stoccare':p.state==='out'?'Uscito':'Stoccato'}</p>${p.state==='pending'&&p.dest?`<button onclick="receive('${p.code}','${code}')">Conferma stoccaggio</button>`:p.state==='stored'&&p.dest?`<button onclick="openZone('${p.dest.split('-')[0]}','${p.dest}','${code}')">Mostra posizione</button>`:''}</div>`).join('')}`}
function changeDue(code,value,c){if(value){allPallets().find(p=>p.code===code).due=value;plan()}containerView(c)}
function receive(code,c){let p=allPallets().find(p=>p.code===code);if(!p||p.state!=='pending'||!p.dest||db[p.dest])return;if(!confirm(`Confermare ${code} in ${p.dest}?`))return;let k=p.dest;db[k]={code:p.code,desc:'Bancale da '+p.code.split('-')[0],date:new Date().toISOString(),due:p.due};p.state='stored';history.unshift({type:'IN',k,...db[k],at:new Date().toISOString()});plan();openZone(k.split('-')[0],k,c||null)}
function outbound(){app.innerHTML=`<button onclick="map(0)">← Mappa</button><h2>OUT · Merci in uscita</h2>${Object.entries(db).sort((a,b)=>(a[1].due||'9999').localeCompare(b[1].due||'9999')).map(([k,d])=>`<div class="panel"><b>${esc(d.code)}</b> · ${esc(k)}<p>Uscita prevista: ${esc(d.due||'Non definita')}</p><button onclick="out('${k}')">Registra uscita</button></div>`).join('')||'Nessuna merce stoccata'}`}
plan();map(0);

</script></html>
